; ESP32-S3-N16R8 hardware verification
; Module: ESP32-S3 + 16 MB flash + 8 MB octal PSRAM, ESP32-S3-DevKitC-1-style board.
;
; The stock `esp32-s3-devkitc-1` definition shipped with espressif32 is the N8
; variant -- it declares 8 MB flash and NO PSRAM:
;     "Espressif ESP32-S3-DevKitC-1-N8 (8 MB QD, No PSRAM)"
; The MCU, variant, pinout and USB hwids are correct, so we keep the official
; board ID and override only the memory description below.

[env:esp32-s3-devkitc-1]
platform = espressif32@7.1.1
board = esp32-s3-devkitc-1
framework = arduino

; --- 16 MB flash (board default is 8 MB) ---
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; --- 8 MB PSRAM (board default declares none) ---
; memory_type is "<flash_mode>_<psram_type>". Quad-SPI flash + octal-SPI PSRAM.
; If this board turns out to be a WROOM-2 (octal flash, N16R8V), change this
; single value to opi_opi.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio

; Route Arduino `Serial` to the native USB-Serial/JTAG CDC interface on COM5.
; Without ARDUINO_USB_CDC_ON_BOOT, Serial binds to UART0 -- different physical
; pins from the native USB port, so nothing reaches the monitor.
; The board definition already supplies ARDUINO_USB_MODE=1 (hardware CDC).
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

; --- Serial ---
upload_port = COM5
upload_speed = 921600
monitor_port = COM5
monitor_speed = 921600
